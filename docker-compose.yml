# PostgreSQL is deliberately NOT part of the production topology — point
# DATABASE_URL at a managed/external instance instead (L-23 decision).
# The local stack (docker-compose.local.yml) ships a postgres service for
# development only.
services:
  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      app:
        condition: service_started
      api:
        condition: service_healthy
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: apps/app/Dockerfile
      args:
        VITE_API_BASE_URL: https://api.${DOMAIN}
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - .env
    healthcheck:
      # Liveness, not readiness: a DB outage should drop this instance out of the
      # traffic pool, not make Docker keep restarting a healthy process.
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
