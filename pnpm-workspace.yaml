packages:
  - "apps/*"
  - "packages/*"
# Turns the `engines.node` field in every workspace package.json into a hard gate: pnpm exits
# non-zero on an older Node instead of warning and installing anyway. Node 24.21 is a real floor:
# the ESM-only NestJS 12 packages load through `require(esm)`, so a warning that scrolls past leaves
# an import error at API boot as the first real symptom.
# pnpm reads this here, not from `.npmrc`; the npm-era `engine-strict` key is silently ignored.
engineStrict: true
allowBuilds:
  # Transitive dep of Jest 30 (jest-haste-map), used only by watch mode. The prebuilt binary
  # comes from an optional dependency, and the install script only compiles from source when
  # no prebuilt binary matches, so it stays denied.
  '@parcel/watcher': false
  '@prisma/client': true
  '@prisma/engines': true
  # Transitive dep of @nestjs/swagger. Its postinstall is anonymous usage telemetry —
  # nothing needs it to build or run, so it stays denied.
  '@scarf/scarf': false
  argon2: true
  core-js: true
  esbuild: true
  # Optional native accelerator pulled in by bullmq -> msgpackr. msgpackr falls back
  # to its pure-JS packer when the binding is absent, so denying the node-gyp build
  # costs a little serialization speed on a low-volume notification queue and keeps a
  # compiler out of the production image. Flip to true if the queue ever gets hot.
  msgpackr-extract: false
  prisma: true
  unrs-resolver: true
  # Transitive dependency of @floating-ui/vue, which reka-ui uses. Its postinstall only
  # switches the build for Vue 2.
  # The default build already targets Vue 3, so the script stays denied.
  vue-demi: false
minimumReleaseAgeExclude:
  - pnpm@11.11.0
  - '@nestjs/cli@12.0.5'
  - '@nestjs/common@12.1.0'
  - '@nestjs/config@12.0.1'
  - '@nestjs/core@12.1.0'
  - '@nestjs/platform-express@12.1.0'
  - '@nestjs/schematics@12.0.5'
  - '@nestjs/swagger@12.0.2'
  - '@nestjs/testing@12.1.0'
  - dotenv@18.0.3
# @nest-lab/throttler-storage-redis 1.2.0 caps its @nestjs peers at ^11 and has no v12 release.
# It needs only the @nestjs/common barrel at runtime, which v12 keeps, and the e2e suite exercises
# it on every run. Remove these entries when upstream widens the range.
peerDependencyRules:
  allowedVersions:
    '@nest-lab/throttler-storage-redis>@nestjs/common': '12'
    '@nest-lab/throttler-storage-redis>@nestjs/core': '12'
